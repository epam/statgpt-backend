#      NEXTAUTH_SECRET: "placeholder"
#      NEXTAUTH_URL: "http://localhost:4300"

  #----- Data & storage services -----#

  vectordb:
    hostname: vectordb
    image: pgvector/pgvector:pg14
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_DB=${PGVECTOR_DATABASE}
      - POSTGRES_USER=${PGVECTOR_USER}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ${INIT_SQL_PATH:-./scripts/init.sql}:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    ports:
      - "9200:9200"
    environment:
      xpack.security.enabled: false
      xpack.security.enrollment.enabled: false
      discovery.type: single-node
      node.name: es-node-01
    volumes:
      - elastic-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7.4.1-alpine3.20
    restart: always
    ports:
      - "6379:6379"
    mem_limit: 2200M
    command: >
      redis-server
      --maxmemory 2000mb
      --maxmemory-policy volatile-lfu
      --save ""
      --appendonly no
      --loglevel warning

  #----- AI DIAL services -----#

  ai-dial-core:
    user: ${UID:-root}
    ports:
      - "8080:8080"
    image: epam/ai-dial-core:latest
    environment:
      'AIDIAL_SETTINGS': '/opt/settings/settings.json'
      'JAVA_OPTS': '-Dgflog.config=/opt/settings/gflog.xml'
      'LOG_DIR': '/app/log'
      'STORAGE_DIR': '/app/data'
      'aidial.config.files': '["/opt/config/config.json"]'
      'aidial.storage.maxUploadedFileSize': '2147483648' # 2 GB
      'aidial.storage.overrides': '{ "jclouds.filesystem.basedir": "data" }'
      'aidial.redis.singleServerConfig.address': 'redis://redis:6379'
    depends_on:
      - redis
    volumes:
      - ${DIAL_DIR:-.}/dial/core/settings:/opt/settings
      - ${DIAL_DIR:-.}/dial/core/config:/opt/config
      - ${DIAL_DIR:-.}/dial/core/logs:/app/log
      - ai-dial-core-data:/app/data

  ai-dial-adapter-dial:
    image: epam/ai-dial-adapter-dial:latest
    ports:
      - "5000"
    environment:
      DIAL_URL: "http://ai-dial-core:8080"
      LOG_LEVEL: "INFO"

  ai-dial-chat:
    ports:
      - "3000:3000"
    image: epam/ai-dial-chat:latest
    depends_on:
      - ai-dial-themes
      - ai-dial-core
    environment:
      NEXTAUTH_SECRET: "secret"
      THEMES_CONFIG_HOST: "http://ai-dial-themes:8080"
      DIAL_API_HOST: "http://ai-dial-core:8080"
      DIAL_API_KEY: ${DIAL_API_KEY}
      ENABLED_FEATURES: "conversations-section,prompts-section,top-settings,top-clear-conversation,top-chat-info,top-chat-model-settings,empty-chat-settings,header,footer,request-api-key,report-an-issue,likes,conversations-sharing,input-files,attachments-manager,prompts-sharing,prompts-publishing,conversations-publishing,custom-logo,input-links,custom-applications,message-templates,marketplace,quick-apps,code-apps,applications-sharing,marketplace-table-view"
      KEEP_ALIVE_TIMEOUT: ${CHAT_KEEP_ALIVE_TIMEOUT:-20000}

      AUTH_DISABLED: "false"
      AUTH_AZURE_AD_CLIENT_ID: '22cf1b3f-2609-494a-8736-98dd32ac392f'
      AUTH_AZURE_AD_NAME: 'Ai.Dial.Auth.Client'
      AUTH_AZURE_AD_SCOPE: 'openid profile 22cf1b3f-2609-494a-8736-98dd32ac392f/.default email offline_access'
      AUTH_AZURE_AD_SECRET: ${AUTH_AZURE_AD_SECRET}
      AUTH_AZURE_AD_TENANT_ID: 'b41b72d0-4e9f-4c26-8a69-f949f367c91d'


  ai-dial-themes:
    image: epam/ai-dial-chat-themes:latest
    ports:
      - "3001:8080"

  admin-ui:
    image: epam/statgpt-admin-frontend:development
    ports:
      - "4100:3000"
    environment:
#      API_URL: "http://host.docker.internal:8000/admin"
      API_URL: "http://172.17.0.1:8000/admin"
      NEXTAUTH_URL: "http://localhost:4100/"

      NEXTAUTH_SECRET: "00000000000000000000000000000000012"
      AUTH_AZURE_AD_CLIENT_ID: "464eff6d-0ce2-4974-ac40-e883594eb8f6"
      AUTH_AZURE_AD_NAME: "AI.TTYD.Clients.SPA.Admin"
      AUTH_AZURE_AD_SCOPE: "openid profile ff68c66a-fb6a-4a7f-ac52-31e971030b14/Admin.Login email offline_access"
      AUTH_AZURE_AD_TENANT_ID: "b41b72d0-4e9f-4c26-8a69-f949f367c91d"
      AUTH_AZURE_AUTHORITY_URL: "https://login.microsoftonline.com/"
      AUTH_AZURE_AD_SECRET: ${ADMIN_UI_AUTH_AZURE_AD_SECRET}

