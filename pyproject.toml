[project]
name = "statgpt"
version = "0.0.0"
description = "StatGPT: Platform for talking to Official Statistics data & SDMX"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Core framework & API
    'aidial-sdk[telemetry] (>=0.39.0,<0.40.0)',  # DIAL integration SDK
    'fastapi (>=0.133.0,<1.0.0)',                # Web framework; >=0.133 required for starlette 1.x
    'pydantic (>=2.11.7,<3.0.0)',                # Data validation
    'pydantic-core (>=2.33.2,<3.0.0)',           # Pydantic core functionality
    'pydantic-settings (>=2.14.2,<3.0.0)',       # Settings management

    # SDMX & Data processing
    'sdmx1 (>=2.26.0,<3.0.0)',                   # SDMX data format support
    'pandas (>=2.2.3,<3.0.0)',                   # Data manipulation
    'numpy (>=1.26.4,<2.0.0)',                   # Pinned to 1.x: CVE-2018-1999024 is a false positive (MathJax XSS); avoid breaking 2.x major
    'plotly (>=5.21.0,<6.0.0)',                  # Data visualization

    # Database & Vector storage
    'sqlalchemy (>=2.0.45,<3.0.0)',              # ORM and async database toolkit
    'asyncpg (>=0.29.0,<0.30.0)',                # Async PostgreSQL driver
    'pgvector (>=0.2.5,<0.3.0)',                 # Vector similarity search
    'alembic (>=1.13.1,<2.0.0)',                 # Database migrations
    'psycopg[binary,pool] (>=3.1.18,<4.0.0)',    # PostgreSQL adapter

    # Search
    'elasticsearch[async] (>=8.14.0,<9.0.0)',    # Elasticsearch client

    # LLM & AI
    'langchain (>=1.3.9,<1.4.0)',                # LLM orchestration framework
    'langchain-core (>=1.4.7,<1.5.0)',           # Core LangChain functionality
    'langchain-openai (>=1.1.0,<2.0.0)',         # OpenAI LangChain integration
    'openai (>=2.26.0,<3.0.0)',                  # OpenAI API client

    # HTTP & Networking
    'aidial-client (>=0.14.0,<1.0.0)',           # DIAL API client
    'httpx (>=0.28.1,<0.29.0)',                  # HTTP client (used directly in this project)
    'aiohttp (>=3.14.3,<3.15.0)',                # Async HTTP client/server
    'requests (>=2.32.5,<3.0.0)',                # HTTP library

    # Authentication & Security
    'azure-identity (>=1.25.1,<2.0.0)',          # Azure authentication
    'PyJWT (>=2.13.0,<3.0.0)',                    # JSON Web Token support

    # Configuration & File handling
    'python-dotenv (>=1.2.2,<2.0.0)',            # Environment variable management
    'pyyaml (>=6.0.1,<7.0.0)',                   # YAML file support
    'python-multipart (>=0.0.27,<0.1.0)',        # Multipart form data (for FastAPI file uploads)

    # Utilities
    'python-dateutil (>=2.9.0.post0,<3.0.0)',    # Date/time utilities
    'tzlocal (>=5.2,<6.0)',                      # Local timezone detection
    'greenlet (>=3.0.3,<4.0.0)',                 # Lightweight concurrency
    'async-lru (>=2.0.5,<3.0.0)',                # Async LRU cache
    'tabulate (>=0.9.0,<0.10.0)',                # Table formatting
    'markdown (>=3.7,<4.0)',                     # Markdown processing
    'setuptools (>=83.0.0,<84.0.0)',             # Package management
    'babel (>=2.17.0,<3.0.0)',                   # Internationalization
    'aiofiles (>=25.1.0,<26.0.0)',               # Async file operations
    'pyarrow (>=23.0.1,<24.0.0)',                # Parquet support for import/export
]

[project.optional-dependencies]
cli = [
    "prompt-toolkit>=3.0.48,<4.0.0",
    "questionary>=2.1.0,<3.0.0",
    "rich>=13.9.4,<14.0.0",
    "msal>=1.37.0,<2.0.0",
    "python-keycloak>=4.0.0,<5.0.0",
]
mcp = [
    "fastmcp>=3.4.3,<4.0.0",
]

[project.scripts]
statgpt = "statgpt.cli:main"

[tool.isort]
profile = "black"
line_length = 100
# https://pycqa.github.io/isort/docs/configuration/options.html
# Src Paths: Add an explicitly defined source path
# (modules within src paths have their imports automatically categorized as first_party).
# see also: https://github.com/PyCQA/isort/issues/1147
src_paths = ["statgpt"]

[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ["py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
  | profiling
)/
'''

[tool.pyright]
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = "error"
reportUnusedVariable = "error"

exclude = [
    ".git",
    ".venv",
    ".nox",
    "**/__pycache__",
    "**/.pytest_cache"
]

[tool.autoflake]
ignore_init_module_imports = true
remove_all_unused_imports = true
in_place = true
recursive = true
quiet = true
exclude = [
    '\.git',
    '\.venv',
    '\.nox',
    '\.pytest_cache',
    '__pycache__'
]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["aidial_sdk.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["msal.*", "keycloak.*"]
ignore_missing_imports = true

[tool.poetry]
package-mode = true
requires-poetry = '>=2.0.0,<3.0.0'

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
# Formatters & linters
autoflake = "^2.3.1"
black = "^26.3.1"
flake8 = "^7.2.0"
isort = "^5.13.2"

# Type checking
mypy = "^1.19.1"
pyright = "^1.1.394"

# Type stubs
pandas-stubs = "^2.2.1.240316"
plotly-stubs = "^0.1.2"
pyarrow-stubs = "^20.0.0.20251215"
types-aiofiles = "^25.1.0.20251011"
types-python-dateutil = "^2.9.0.20240316"
types-pyyaml = "^6.0.12.20240311"
types-requests = "^2.31.0.20240406"

# Testing
freezegun = "^1.5.1"
pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
pytest-sugar = "^1.0.0"
pytest-xdist = "^3.6.1"

# Git hooks
pre-commit = "^3.8.0"

[build-system]
requires = ['poetry-core (>=2.0.0,<3.0.0)']
build-backend = "poetry.core.masonry.api"
