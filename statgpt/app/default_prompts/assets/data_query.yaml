datetimePrompt: |-
  Extract the time range and temporal intent from the user's query. Today is {current_date}.

  **Only extract dates explicitly stated or clearly implied. Do NOT infer or fill missing bounds.**
  If only start is mentioned, end is null (and vice versa).

  ## Intent

  - **forecast**: forecast keywords, future tense, "next N", or all dates after {current_date}
  - **historical**: past tense, "last N", or all dates before {current_date} — AND no forecast keywords
  - **spanning**: present tense + time ref, range crossing {current_date}, "all available data/dates", or tenseless open reference from the past (e.g. "give me X from 2010")
  - **unspecified**: no temporal reference, or only non-temporal years

  Priority: forecast keywords > tense > date position > default spanning.

  Forecast keywords: "predicted", "projected", "extrapolated", "forecast", "projection".
  "estimates"/"estimated" are NOT forecast keywords and do not imply any temporal intent. In official statistics these refer
  to values computed from observed data (e.g. "preliminary estimates", "latest GDP estimated")

  ## Date conversion

  Start → first day of period. End → last day of period. Leap-year and month-length aware.

  Absolute periods:
  - Year: "in 2020" → 2020-01-01 / 2020-12-31
  - Range: "2010 to 2020" → 2010-01-01 / 2020-12-31
  - Month: "Feb 2024" → 2024-02-01 / 2024-02-29
  - Quarter: "Q3 2008" → 2008-07-01 / 2008-09-30
  - Half-year: "first half 2023" → 2023-01-01 / 2023-06-30

  Relative rolling windows (quarter = 3 months):
  - "last N years/months" → {current_date} minus N periods / {current_date}
  - "last N quarters" → {current_date} minus N×3 months / {current_date}
  - "next N years" → {current_date} / Dec 31 of the year N years after current, e.g. "next 2 years" from 2025 → 2027-12-31
  - "next N months" → {current_date} / last day of the Nth month after current, e.g. "next 3 months" from Sep → Dec 31
  - "next N quarters" → {current_date} / last day of the (N×3)th month after current

  Singular "last/next month/quarter/year" = N=1. "last month" is NOT the completed previous month —
  it equals "last 1 month" = {current_date} minus 1 month / {current_date}.

  "this year/month/quarter" (or "current year" etc.) → full period boundaries, current_period=true.
  "in 2025" is NOT current_period even if 2025 is the current year.

  Requests for the latest available data (e.g. "latest GDP", "most recent data") without a period granularity
  do not specify a concrete time period. Leave as unspecified — downstream defaults apply.

  "most recent/latest month/quarter/year" → previous completed calendar period boundaries (historical).

  Non-temporal years — NOT time filters, ignore:
  "in 2010 prices", "2010=100", "ICP benchmark 2021", "born 1986-2007".
  Only extract co-occurring real time references.

  The patterns above are not exhaustive. Interpret any temporal reference the user makes.

  ## Examples

  Examples below assume today is 2025-09-18.

  - "CPI in 2016-2019" → {{"intent":"historical","start":"2016-01-01","end":"2019-12-31","current_period":false}}
  - "GDP forecast from 2030 till 2035" → {{"intent":"forecast","start":"2030-01-01","end":"2035-12-31","current_period":false}}
  - "CPI in 2030" → {{"intent":"forecast","start":"2030-01-01","end":"2030-12-31","current_period":false}}
  - "Forecast till 2030" → {{"intent":"forecast","start":null,"end":"2030-12-31","current_period":false}}
  - "Projected inflation of Austria" → {{"intent":"forecast","start":null,"end":null,"current_period":false}}
  - "Estimated GDP till 2030" → {{"intent":"forecast","start":null,"end":"2030-12-31","current_period":false}}
  - "What was GDP from 2010?" → {{"intent":"historical","start":"2010-01-01","end":null,"current_period":false}}
  - "Give me X until 2006" → {{"intent":"historical","start":null,"end":"2006-12-31","current_period":false}}
  - "for the last 5 years" → {{"intent":"historical","start":"2020-09-18","end":"2025-09-18","current_period":false}}
  - "last month" → {{"intent":"historical","start":"2025-08-18","end":"2025-09-18","current_period":false}}
  - "for the last 2 quarters" → {{"intent":"historical","start":"2025-03-18","end":"2025-09-18","current_period":false}}
  - "for the next year" → {{"intent":"forecast","start":"2025-09-18","end":"2026-12-31","current_period":false}}
  - "for the next 2 years" → {{"intent":"forecast","start":"2025-09-18","end":"2027-12-31","current_period":false}}
  - "for the next 3 months" → {{"intent":"forecast","start":"2025-09-18","end":"2025-12-31","current_period":false}}
  - "the most recent month" → {{"intent":"historical","start":"2025-08-01","end":"2025-08-31","current_period":false}}
  - "latest GDP of Germany" → {{"intent":"unspecified","start":null,"end":null,"current_period":false}}
  - "What is CPI this year?" → {{"intent":"spanning","start":"2025-01-01","end":"2025-12-31","current_period":true}}
  - "What was CPI this year?" → {{"intent":"historical","start":"2025-01-01","end":"2025-12-31","current_period":true}}
  - "What will CPI be this year?" → {{"intent":"forecast","start":"2025-01-01","end":"2025-12-31","current_period":true}}
  - "give me X from 2010" → {{"intent":"spanning","start":"2010-01-01","end":null,"current_period":false}}
  - "for all available dates" → {{"intent":"spanning","start":null,"end":null,"current_period":false}}
  - "CPI for France" → {{"intent":"unspecified","start":null,"end":null,"current_period":false}}
  - "in 2010 prices for 2010-2012" → {{"intent":"historical","start":"2010-01-01","end":"2012-12-31","current_period":false}}

  Today is {current_date}
groupExpanderPrompt: >-
  You are an expert in statistical data and geography.
  You will be provided with a list of available country groups and a user query.
  Your task is to identify the country groups mentioned in the user query and
  expand them to their members when necessary.

  Detailed instructions:

  1) You must find all country groups mentioned in the user query and detect whether
  the user query refers to the whole group, its members, or both.

  2) You must replace found country group name in the user query with the corresponding placeholder.

  3) You must determine if the user's request contains any country groups that
  are not in the list of available country groups.

  Your answer MUST have the following format:

  {format_instructions}

  Available country groups:
  {country_groups}

  # Examples

  Let's assume the available country groups are as follows: [{{"ID": 999, "name": "European Union"}}]

  Example 1:
  "I need data for European Union members" -> {{
    "found_groups ": {{999: "members"}},
    "template": "I need data for <GROUP_999>",
    "absent_groups": []
  }}

  Example 2:
  "I want data for the European Union" -> {{
    "found_groups ": {{999: "whole"}},
    "template": "I want data for <GROUP_999>",
    "absent_groups": []
  }}

  Example 3:
  "I need data on the countries of the European Union and the entire union." -> {{
    "found_groups ": {{999: "both"}},
    "template": "I need data for <GROUP_999>",
    "absent_groups": []
  }}

  Example 4:
  "Hello!" -> {{
    "found_groups ": {{}},
    "template": "Hello!",
    "absent_groups": []
  }}

  Example 5:
  "What is the GDP of MINT countries?" -> {{
    "found_groups ": {{}},
    "template": "What is the GDP of MINT countries?",
    "absent_groups": ["MINT"]
  }}

  Example 6:
  "What is the GDP of MINT?" -> {{
    "found_groups ": {{}},
    "template": "What is the GDP of MINT?",
    "absent_groups": ["MINT"]
  }}
groupExpanderFallbackPrompt: >-
  You are an expert in statistical data and geography.
  You will be provided with list of target country groups and a user query.
  Your task is to understand whether the user wants to receive information for each participant or for the entire group.
  If the user wants to receive information about each member , the target group must be replaced by its members.

  Target country groups: {absent_groups}

  You must return user request with the target country groups replaced by the corresponding countries
  if necessary. The remaining parts of the user's request must remain unchanged in the response.
  If the user query does not contain any target country groups or he refers to the entire group,
  you must return the original query. Do not include any additional data, comments or text.

  Examples of mentions of group members: "<group> members", "<group> countries", "countries of <group>",
  "members of <group>", "nations in <group>", "compare <something> for <group>", etc.

  Examples of mentions of the entire group: "I want data for the G7.", "<group> as a group", "<group> region", etc.

  Example 1:
  "What is the GDP of MINT countries?" -> "What is the GDP of Mexico, Indonesia, Nigeria and Turkey?"

  Example 2:
  "What is the GDP of MINT?" -> "What is the GDP of MINT?"
normalizationPrompt: >-
  You are an expert in Economics, Statistics, Statistical Data and
  Metadata Exchange and Time Period formatting.

  Your ONLY TASK is to REWRITE the query by (1) expanding COMMONLY KNOWN abbreviations or (2)
  providing such abbreviation after the unabbreviated text

  Details:

  - detect and resolve all acronyms in-place

  - if term or abbreviation is NOT COMMONLY KNOWN do not expand it

  - DO NOT expand acronyms and abbreviations if their meaning is NOT CLEAR
  and OBVIOUS from the context.

  - you MUST NEVER expand any country groups to its members. for example,
  "EU" must be resolved to "European Union", but it MUST NOT be expanded
  to its member countries.

  Examples:

  1. give me gdp for France -> give me gross domestic product (GDP) for France
  2. give me consumer price index for Germany -> give me consumer price index (CPI) for Germany
namedEntitiesPrompt: >-
  You are an expert in named entity recognition and text labeling.

  Your task is to detect the following entity types in the input text: {entity_types}.

  Follow these instructions:

  1. Label as many entities as possible in the input text.

  2. Avoid finding meaningless entities.

  3. Do not introduce new entity types.

  4. Entities of some entity types might not be present in input text.

  5. Do not introduce or add entities that are not present in input.

  6. Add FREQUENCY type entities ONLY IF data frequency is EXPLICITLY mentioned in the input.
  If frequency is not explicitly mentioned, do not add FREQUENCY type entities.

  Format your response as JSON: {format_instructions}
indicatorsSelectionSystemPrompt: >-
  You are an expert in Economics and Statistics helping user to select relevant indicators.
  You are provided with the user query and a list of candidates extracted from the database.

  By "relevant" we define indicators that contain ALL indicator specifications from the user query.
  Relevant candidates are ALLOWED to contain additional specifications -
  this makes them sub-indicators, and sub-indicators MUST also be selected.

  Examples.
  Please mind that list of relevant/irrelevant indicators here is not exhaustive
  and serves only as an example. Lists of candidates between examples do not overlap.

  1.Query: "Show me the GDP per capita in current prices for USA and Germany".
  Relevant: "GDP per capita, current prices", "GDP per capita, current prices, USD".
  Irrelevant:
  "GDP", "GDP per capita", "GDP, current prices",
  "GDP per capita, constant prices", "GDP per capita, constant prices, USD",
  "Gross National Income per capita", "Gross National Income per capita, current prices",
  "Inflation rate".

  2. Query: "Give me GDP per capita".
  Relevant: "GDP per capita", "GDP per capita, current prices", "GDP per capita, constant prices".
  Irrelevant: "GDP", "Gross National Income", "GDP, constant prices".

  3. Query: "Please add inflation for France".
  Relevant: "CPI", "CPI, all items", "CPI, percent change", "CPI, harmonized",
  "CPI, transport", "CPI, food", "Inflation rate", "Inflation on transport".
  Irrelevant: "GDP", "GDP per capita".

  4. Query: "Add Consumer Prices, period average, percent change".
  Relevant:
  "Consumer Prices, Core, period average, percent change"
  "Consumer Prices, period average, percent change"
  "Consumer Prices, Core , period average, seasonally adjusted, quarter-over-quarter percent change, annualized"
  "Consumer Prices, Core, period average, seasonally adjusted, year-over-year percent change"
  "Consumer Prices, period average, year-on-year percent change"
  "Inflation, consumer prices (annual %)"
  Irrelevant:
  "Consumer Prices, period average",
  "CPI, percent change"

  Format your answer as JSON: {format_instructions}
validationSystemPrompt: >-
  You are an expert in Statistical Data and Metadata Exchange.
  Your task is to help the user to build a data query
  by selecting dimension values (from the list provided) REQUESTED by user.

  Notes:

  - Same dimension values from different datasets may have different wording, for example
  "USA" in one dataset and "United States" in other - in this case you MUST select all of them,
  if they are relevant.

  - "Counterparty area" usually refers to the geographic region or country
  that is engaged in trade or other activity with the main country.
  Be careful to correctly identify (main) country and counterparty area dimensions.

  - values for "Frequency" dimension (or its synonyms like "FREQ") must ONLY be selected if user query EXPLICITLY specifies data frequency (eg "give me quarterly GDP")

  - It's allowed to select nothing if all dimension values are irrelevant.

  - Dimension values might also have the "system code" field.
  Use it ONLY for reference, NEVER include its values to your response.

  - In your response ONLY use IDs that are explicitly stated


  Please provide only REQUESTED dimension values as an output.
  Do not include any additional data, comments or text.

  Make sure you analyzed the WHOLE provided list of dimension values and did not skip anything requested by user.

  Format your answer as JSON: {format_instructions}
validationUserPrompt: >-
  User query: `{normalized_query}`


  Dimension values to filter (grouped by dimension):


  {selection_candidates_formatted}
datasetSelectionPrompt:
  systemMessage: |-
    You are an expert in Economics and Statistical Data and Metadata Exchange.
    You are provided with the user query aiming to build a data query.
    Your tasks are to:
    1. detect if user specified a dataset filter
    2. if user specified datasets, build datasets filter
    3. if user specified datasets, remove detected datasets references from the user query

    ## Notes
    - It is allowed to select datasets ONLY FROM the provided list of available datasets
    - You must select only datasets that are EXPLICITLY required in the user query
    - User might refer to datasets using any metadata available (name/id/provider/description/etc)
    - Some datasets are named like statistical indicators they contain.
    User asking for such indicators IS NOT A SUFFICIENT condition to select such datasets.
    Select them ONLY if user EXPLICITLY asks for such datasets.
    - If unsure, DO NOT select a dataset
    - If user asked for BOTH indicator and identically named dataset:
    (1) select dataset, (2) remove dataset reference from user query and (3) keep indicator in user query
    - To distinguish between indicators and datasets, pay attention to words and grammar.
    Datasets usually go after words like "from", "according to".
    - If user asked to filter datasets only by provider
    and mentions indicator matching a dataset name,
    select ALL datasets with that provider, not just the datasets that contain that indicator.
    - Partial matches of provider names are allowed. For example, if user asks for datasets by IMF,
    datasets with provider "IMF.STA" or "IMF.RES" or similar should also be selected, not just datasets
    with provider "IMF".
    - In your response, you MUST include the numeric IDs of datasets, not source IDs.


    ## Examples
    Assume that following datasets are available (only for examples below):
    **Consumer Price Index (CPI)**
        * Provider: IMF.STA
    **Quarterly Gross Domestic Product (GDP), World and Country Aggregates**
        * Provider: IMF.STA
    **World Economic Outlook (WEO)**
        * Provider: IMF.RES

    Examples:

    1. "give me consumer price index":
    - query for indicator, no dataset specified
    - no dataset filter
    - leave query unchanged

    2. "Give me CPI according to CPI dataset":
    - query for both indicator and dataset
    - select CPI dataset
    - new query: "Give me CPI"

    3. "Give me all data from Consumer Price Index dataset":
    - query for dataset, no indicators specified
    - select CPI dataset
    - new query: "Give me all data"

    4. "give me quarterly GDP":
    - query for indicator, no dataset specified
    - no dataset filter
    - leave query unchanged

    5. "give me inflation and growth indicators from 2010 to 2020":
    - query for indicators, no dataset specified
    - no dataset filter
    - leave query unchanged

    6. "Query main indicators according to IMF":
    - query for indicators, dataset provider is specified
    - select ALL available datasets from the list provided by "IMF"
    - new query: "Query main indicators"

    7. "Consumer Price Index (CPI)":
    - query for indicator, no dataset specified
    - no dataset filter
    - leave query unchanged

    8. "provide data on harmonized cpi for Finland":
    - query for indicator, no dataset specified
    - no dataset filter
    - leave query unchanged
  userMessage: |-
    <available_datasets>
    {datasets_list}
    </available_datasets>

    User query: {normalized_query}
incompleteQueriesPrompt: >-
  You are an expert in Statistical Data and Metadata Exchange.
  Your task is to provide a response to the user when the query is incomplete.
  This is the query that is missing some dimensions:

  {formatted_query_with_missing_dimensions}

  You should provide a clear and concise message to the user.
  You can ask the user to somehow modify the query or provide additional information.
  If you have a list of example values, try to summarize
  them and provide example values that the user might use.
  Mention that the user can see all the possible values in the attachments below.

  As an output provide only the text of the message. Do not include any additional data, comments or text.
summarizeQueriesPrompt: |-
  You are an expert in Official Statistics.
  Your task is to interpret and summarize the data query to natural language.
  The summary should be concise and easy to understand for a general audience.
  The summary **must be in {language}**.

  Explicitly mention value of the "Factual time period" of the retrieved data.
  However, NEVER use "data covers" or "data is available for" or similar phrasings - THEY MISLEAD THE USER!
  Instead, phrase it as "data was retrieved from X to Y".
  Focus on what was retrieved, not what was queried.
  NOTE: if default time period was used in query, you MUST EXPLICITLY state that the retrieved data corresponds to default time period.
