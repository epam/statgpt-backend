notes:
  - "Four datasets in the channel expose a 'bank credit' concept for South Africa. They measure DIFFERENT things and should not be conflated:"
  - "  1. IMF.STA:FSIC (FSI 709) — credit by all deposit takers (banks broadly) to the private sector, ~R4.6 trillion in 2023-Q3. Best match for the colloquial 'bank credit in South Africa'."
  - "  2. IMF.STA:FAS — outstanding loans on commercial banks' balance sheets only, annual, ~R3.76 trillion in 2023. Commercial-bank slice of (1)."
  - "  3. BIS:WS_LBS_D_PUB — cross-border bank claims ON South African residents (foreign banks lending into ZA), ~$32-37 billion. Different perspective (external lending to ZA borrowers)."
  - "  4. IMF.STA:MFS_CBS — claims on private sector held by the central bank (SARB) only, ~R450M monthly. Tiny vs. commercial banks; central-bank-survey scope."
  - "Datasets considered and rejected:"
  - "  - IMF.STA:BOP / IMF.STA:IIP — 'Other investment, Loans' to/from non-financial corporations etc. are external-position concepts (loans to/from non-residents), not domestic bank credit. Probe 'loans to households non-financial corporations' top hit was BOP O_F4_S1V which is cross-border 'Other investment'."
  - "  - BIS:WS_NA_SEC_DSS — debt securities issued (by issuer), not bank lending. Not surfaced as a top-20 hit for any of the 4 'bank credit'-family probes."
  - "  - IMF.STA:NSDP — country-curated NSDP categories do not include a credit/loans category."
  - "  - IMF.RES:WEO / IMF.FAD:FM — macro and fiscal aggregates only; no credit series surfaced."
  - "  - IMF.STA:DIP / IMF.STA:PIP — direct/portfolio investment positions, not bank credit."
  - "  - IMF.STA:GFS_SOO, ANEA, QNEA, CPI, ER, EER, BIS:WS_EER, IMTS — out of scope (fiscal, national accounts, prices, exchange rates, trade)."
  - "Caveats:"
  - "  - FSIC value 4,510,149,000,000 is in absolute Rand (SCALE field metadata = 6 / millions, but the 'value' field is already in absolute units). Downstream presenters should respect SCALE when picking units."
  - "  - BIS LBS values are in USD millions (UNIT_MULT=6) — different unit from FSIC/FAS which are in domestic currency (Rand). Cannot be added together without FX conversion."
  - "  - FSIC FSI709 has FREQUENCY in {A, Q}; FAS is annual only; MFS_CBS supports {M, A, Q}; BIS LBS is quarterly. Pick frequency to match the user's intent."
  - "  - For BIS LBS the natural answer to 'what is X' is the latest stock (L_MEASURE=S), not the BIS-calculated annual growth rate (G) which dominated the raw 'bank credit' search; we pinned S explicitly."
  - "  - MFS_CBS top hit 'Claims on Private sector' is scoped to S121 (central bank only). For commercial-bank credit via MFS, an MFS_DC (depository corporations) dataset would be needed — not present in this channel — so FSIC FSI709 fills that role here."
