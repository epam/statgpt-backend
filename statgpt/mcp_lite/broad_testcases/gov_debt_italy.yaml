rejected_datasets:
  - dataset_id: "IMF.STA:BOP(21.0.0)"
    reason: "BOP only has FLOW indicators (net incurrence of liabilities P_F3_S13.L_NIL_T, etc.) — annual transactions, not the stock of debt. A 'what is the gov debt' question is about levels."
  - dataset_id: "IMF.STA:PIP(5.0.0)"
    reason: "PIP measures asset holdings of debt securities by counterpart sector/country (who holds whose paper). 'S13' here means general government as holder of foreign debt securities, not Italy's own debt level."
  - dataset_id: "BIS:WS_LBS_D_PUB(1.0)"
    reason: "Locational banking statistics — bank claims/liabilities on gov sector. Niche slice (bank-held gov debt only), not a measure of total government debt."
  - dataset_id: "IMF.STA:MFS_CBS(24.0.0)"
    reason: "Top hit S121_L_LT_S1311MIXED_CBS is central bank's liabilities TO central government (deposits etc.), not gov debt issued by government."
  - dataset_id: "IMF.STA:NSDP(7.0.0)"
    reason: "Dataset-scoped search for 'government debt' returned no relevant indicators; NSDP_CAT codelist has 8 entries (LS, BOP00, CPI00, ILV00, IND00, MET00, NAG00, PPI00); no Fiscal/Debt category."
  - dataset_id: "IMF.STA:ANEA(6.0.1)"
    reason: "National Economic Accounts — GDP/consumption aggregates, no government balance-sheet indicators."
  - dataset_id: "IMF.STA:QNEA(7.0.0)"
    reason: "Same as ANEA (quarterly cut) — no gov debt indicators."
  - dataset_id: "IMF.STA:CPI(5.0.0)"
    reason: "Consumer prices — unrelated to gov debt."
  - dataset_id: "IMF.STA:DIP(12.0.1)"
    reason: "Direct investment positions (equity/FDI), no gov debt indicators."
  - dataset_id: "IMF.STA:EER(6.0.0)"
    reason: "Effective exchange rates — unrelated."
  - dataset_id: "BIS:WS_EER(1.0)"
    reason: "BIS effective exchange rates — unrelated."
  - dataset_id: "IMF.STA:ER(4.0.1)"
    reason: "Bilateral exchange rates — unrelated."
  - dataset_id: "IMF.STA:FAS(5.0.0)"
    reason: "Financial Access Survey — household/bank access indicators, no government debt."
  - dataset_id: "IMF.STA:FSIC(13.0.1)"
    reason: "Financial Soundness Indicators — bank-sector ratios, no government debt indicators."
  - dataset_id: "IMF.STA:IMTS(1.0.0)"
    reason: "Trade in goods — unrelated."

caveats:
  - "WEO and Fiscal Monitor both report Gross Debt %GDP and the values agree exactly (138.36 / 133.94 / 134.74 for 2022/23/24) — the FM table is the IMF's fiscal team publication and shares the WEO database for this series. Treat them as one source, not two independent estimates."
  - "WEO has post-2024 IMF projections; FM is similar (projection horizon depends on round). The actual 'last observed' year may differ from the latest TIME_PERIOD."
  - "GFS_SOO INDICATOR='L_SP' (general government total liabilities at stock position) is the GFS-standard accrual-basis balance-sheet liability total. It is conceptually close to but not identical to WEO gross debt (which uses face/nominal value of debt instruments only). Italy 2023: GFS_SOO L_SP = 148.31 %GDP vs WEO gross debt = 133.94 %GDP — the difference is mostly other accounts payable, pension liabilities and valuation."
  - "GFS_SOO has many sector cuts (S13 general gov, S1311/S1311B central gov, S1312 state, S1313 local, S1321 cent gov incl SocSec) — pick S13 for the 'whole-of-government' figure."
  - "BIS DSS only covers debt SECURITIES (F3); excludes loans, currency-and-deposits, and other accounts payable. It also requires MATURITY='L' (long-term) for Italy general government — there is no '_T' / 'T' aggregate published for IT/S13. So the figure is approximately bonds outstanding (long-term only), not total gross debt. BIS DSS for Italy gov-sector is a STOCK series (closing balance sheet positions), NOT issuance-only — contrary to the assumption in the prompt."
  - "BIS DSS REF_AREA code for Italy is 'IT' (ISO-2), while IMF datasets use 'ITA' (ISO-3). Mind the cross-dataset code mapping."
  - "IIP covers portfolio-investment debt-securities liabilities of the general-government sector — i.e. the portion of Italian gov debt securities held by NON-RESIDENTS. It is a subset of BIS DSS total gov debt securities, and a much smaller subset of total gross gov debt. Italy 2023 ≈ $714B in IIP vs ~$2.57T in BIS DSS (long-term, all holders) vs €2.87T (~$3.1T) in WEO gross debt."
  - "Currency caveat: WEO/GFS_SOO XDC = EUR for Italy. BIS DSS UNIT_MEASURE=USD reports USD-converted billions. Italy figures are not directly comparable across currencies unless converted."

