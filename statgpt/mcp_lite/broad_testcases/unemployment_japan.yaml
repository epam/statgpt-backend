rejected_datasets:
  - dataset_id: "IMF.STA:NSDP(7.0.0)"
    reason: "Indicator LUR (Unemployment rate, Percent change), LUR_M (Men), LUR_W (Women) - codes are valid for the dataset but availability_query returns 0 observations for COUNTRY=JPN. NSDP only publishes Japan's labor stats as counts (LU_PE Unemployed persons, LE_PE Employed persons), not as the LUR rate series. Counted as a candidate via LU_PE (unemployed count) instead."
  - dataset_id: "IMF.STA:EER(6.0.0)"
    reason: "REER index 'Adjusted by relative unit labor costs' - mentions labor in the title but measures real effective exchange rate, not unemployment."
  - dataset_id: "IMF.STA:GFS_SOO(12.0.0)"
    reason: "Hits on 'employer' / 'employers' social contributions / employer social benefits - government fiscal flows, not unemployment."
  - dataset_id: "IMF.STA:QNEA(7.0.0)"
    reason: "Hits on GVA 'Activities of households as employers of domestic personnel' / 'Human health and social work activities' - sectoral value-added, not unemployment."
  - dataset_id: "BIS:WS_LBS_D_PUB(1.0)"
    reason: "Locational banking statistics matched 'Unallocated by instrument' (code 'U') - false match, no unemployment series."
  - dataset_id: "IMF.STA:BOP(21.0.0)"
    reason: "Hits on 'Border, Seasonal, and Other Short-Term Workers' transport/social-contribution flows - balance of payments items, not unemployment."
caveats:
  - "Two distinct interpretations of the query are exposed by the channel: WEO.LUR gives the unemployment RATE (percent of labor force, annual; includes IMF projections for forward years); NSDP only gives the unemployment COUNT (LU_PE, persons, monthly) for Japan - NSDP's LUR/LUR_M/LUR_W rate series are codelist-valid but have no Japan observations."
  - "If the user wants the canonical 'unemployment rate' number, WEO.LUR is the unique answer. NSDP.LU_PE is included as a candidate only under the broad interpretation that 'unemployment' may mean the unemployed count - it answers a related but different question."
  - "WEO.LUR returns SCALE=0 and an empty UNIT field; values are already in percent (e.g. 2.59 = 2.59%)."
  - "NSDP.LU_PE returns SCALE=4 and empty UNIT; the value field is the raw person count (e.g. 2,070,000 unemployed persons in 2021-M06)."
  - "Only WEO and NSDP surfaced as unemployment-relevant datasets across 4 probes (unemployment rate, jobless rate, unemployed, labour force unemployed, out of work). All other top-20 hits were lexical-noise false matches (employer/employed/employer's-contributions/short-term-workers)."
search_queries_used:
  - "unemployment rate"
  - "jobless rate"
  - "unemployed"
  - "labour force unemployed"
  - "out of work"
tool_call_count: 13
