caveats:
  - "IMF.STA:CPI and IMF.STA:NSDP return identical monthly values for Brazil (6801.72, 6858.17, 6869.14 for 2024-M01..M03). NSDP almost certainly re-publishes the IMF.STA:CPI series under its own composite indicator code (NSDP_CAT='CPI00', INDICATOR='PCPI'). Both are valid sources; downstream agents should pick one to avoid duplicate citation."
  - "IMF.STA:CPI additionally carries a Harmonised CPI (HICP) variant (INDEX_TYPE='HICP'), 13 COICOP expenditure categories (CP01-CP12 plus _T), and multiple transformations (IX, SRP_IX, POP_PCH_PA_PT, YOY_PCH_PA_PT, WGT, etc.) — so the same dataset can answer 'CPI inflation rate', 'CPI for food', etc. Pinned _T+IX here as the headline series."
  - "IMF.STA:NSDP also exposes PCPICAP (capital-city CPI), PCPIHA_IX (harmonized CPI), PCPI_SA (seasonally adjusted), and sub-COICOP variants — additional granularity for the same country."
  - "IMF.RES:WEO PCPI series returns extremely large raw values (~4.5e13 for 2024) — these are annual cumulative-base CPI levels using Brazil's historical reference base, not a 2010=100 index. They are valid CPI levels but require base-aware interpretation; the percent-change transformation is what most users want from WEO."
  - "WEO is annual only (FREQUENCY codelist size = 1, code 'A'); IMF.STA:CPI and NSDP both support Monthly (M) and have Annual/Quarterly too."
  - "Other dimensions ranked highly under 'CPI' search but rejected as the headline answer: WEO commodity price indices (PCEREW, PMETAW, PCOFFW, PNRGW, PMEATW, PNGASW) — these are global commodity prices, not country-level consumer prices, so excluded from Brazil candidates."
