notes:
  - "Four datasets in the channel carry an exchange-rate concept for Mexico, covering distinct measure types:"
  - "  - IMF.STA:ER (Exchange Rates) - the direct/bilateral market rates: MXN per USD/EUR/SDR/ECU and inverses, both period-average (PA_RT) and end-of-period (EoP_RT), Annual/Quarterly/Monthly. This is the most natural answer to 'exchange rate of Mexico' (e.g. 2024 average MXN/USD = 18.305)."
  - "  - IMF.STA:EER (Effective Exchange Rate) - IMF-computed NEER and REER (relative CPI) indices, base 2010=100. Only ACW (all-country weighted) variants are available for Mexico; the AEW (advanced-economy weighted) and REER_RULC variants are NOT - they did not appear in the Mexico-filtered availability query."
  - "  - BIS:WS_EER (BIS Effective exchange rates) - independent BIS NEER/REER series with both Broad (64 economies) and Narrow (27 economies) baskets, Daily and Monthly frequency. Note BIS indices have a different base period than the IMF EER (UNIT_MEASURE=882 in the rows; values ~130 in 2024 vs the IMF ACW index ~77)."
  - "  - IMF.RES:WEO (WEO) PPPEX - 'Rate, Domestic currency per international dollar in PPP terms' - a PPP-derived rate, not a market exchange rate, included as a candidate because it ranked high on multiple probes and uses the phrase 'Rate'. For Mexico 2024 the value (~10.1 MXN per int. dollar) diverges sharply from the market rate (~18.3 MXN per USD), confirming it is a different concept (PPP)."
  - "Datasets considered and rejected:"
  - "  - IMF.STA:GFS_SOO - returned items like 'Exchange profits' / 'Exchange taxes' (government revenue line items) ranked by lexical overlap on 'exchange'; these are fiscal revenue categories, not currency exchange rates."
  - "  - IMF.STA:ANEA / IMF.STA:QNEA - returned 'Gross value added... Domestic currency' on the 'currency value' probe (lexical noise on 'currency'); no exchange-rate concept."
  - "  - IMF.STA:NSDP - returned 'Earnings, Domestic currency' on FX-related probes; not an exchange rate."
  - "  - IMF.STA:IMTS / IMF.STA:FSIC / BIS:WS_LBS_D_PUB - matches on 'US dollar' / 'foreign currency' as the unit dimension of trade/debt indicators, not exchange-rate measures."
  - "Caveats:"
  - "  - IMF.STA:ER quote convention matters: XDC_USD (MXN per USD, 2024A ~18.3) and USD_XDC (USD per MXN, 2024A ~0.0546) are reciprocals - answering 'the exchange rate' should pick a default convention (XDC_USD is the more common 'price of USD in MXN' framing); also disambiguate PA_RT vs EOP_RT."
  - "  - IMF.STA:EER for Mexico only exposes the ACW (all-country weighted) basket. The AEW variant exists in the codelist but availability_query under COUNTRY=MEX returns only NEER_IX_RY2010_ACW and REER_IX_RY2010_ACW_RCPI."
  - "  - BIS:WS_EER and IMF.STA:EER are both effective-rate indices but use different base periods/methodologies/weights - the two are NOT directly comparable as numbers, but both answer 'effective exchange rate of Mexico'."
  - "  - WEO PPPEX is a PPP-implied conversion factor, not a market rate; include only if the user wants 'PPP exchange rate' explicitly. Annual only, includes IMF projections for future years."
  - "  - All four datasets cover Mexico for the latest few years. ER and BIS:WS_EER offer the highest-frequency series (Monthly; BIS also Daily) for the most timely 'current exchange rate' answer."
