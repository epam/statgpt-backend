notes:
  - "Three datasets carry a true 'current account balance' indicator for France: BOP (CAB), WEO (BCA and BCA_NGDPD), and conceptually-overlapping National Economic Accounts (ANEA/QNEA) carry the related but DISTINCT SNA aggregate B11 'External balance of goods and services' (net exports of goods+services only, not the full BoP current account which also includes primary income + secondary income/transfers)."
  - "Primary recommended answer: BOP CAB.NETCD_T (the authoritative BoP-statistics current account balance, available in EUR, XDC, USD, and at both Annual and Quarterly frequencies). WEO BCA agrees closely with BOP CAB on annual values (BOP -40.0B vs WEO -39.7B for 2022) - WEO numbers include IMF projections for future years."
  - "NSDP (IMF.STA:NSDP(7.0.0)) was a candidate (it has indicators BOP00.BCA.XDC etc.) but availability_query and a France-only probe show NSDP does NOT carry any BOP00 category data for France - France's NSDP_CAT availability is limited to {CPI00, IND00, LS, PPI00, NAG00}. Rejected."
  - "Datasets explicitly considered and rejected (no current-account indicator surfaced):"
  - "  - IMF.STA:CPI(5.0.0) - consumer prices"
  - "  - BIS:WS_NA_SEC_DSS(1.0) - debt securities"
  - "  - IMF.STA:DIP(12.0.1) - direct investment positions (financial account, not current)"
  - "  - IMF.STA:EER(6.0.0), BIS:WS_EER(1.0), IMF.STA:ER(4.0.1) - exchange rates"
  - "  - IMF.STA:FAS(5.0.0) - financial access"
  - "  - IMF.STA:FSIC(13.0.1) - financial soundness indicators"
  - "  - IMF.FAD:FM(5.0.0) - fiscal monitor (fiscal balance, not external/current account)"
  - "  - IMF.STA:GFS_SOO(12.0.0) - government finance statistics (returned 'balancing items' on the 'external balance' probe but these are general-government operating balances, not the BoP current account)"
  - "  - IMF.STA:IIP(13.0.0) - international investment position (stocks, not flows; not current account)"
  - "  - IMF.STA:IMTS(1.0.0) - international trade in goods (TBG trade balance is goods only; subset of B11, narrower than CAB)"
  - "  - BIS:WS_LBS_D_PUB(1.0) - locational banking"
  - "  - IMF.STA:MFS_CBS(24.0.0) - central bank monetary statistics"
  - "Caveats:"
  - "  - BOP returns values already in absolute units (USD when UNIT=USD). SCALE=6 in the row metadata is documentation; the 'value' field is already raw."
  - "  - WEO BCA contains IMF forecasts beyond the latest data round; UNIT field is empty in row payload but the indicator description specifies USD."
  - "  - ANEA/QNEA B11 is the SNA 'external balance of goods+services' (net exports), DIFFERENT in scope from the BoP current account (which adds primary and secondary income). It will not match BOP CAB - e.g., France 2022 B11 (XDC) = -72.5B EUR vs BOP CAB (USD) = -40.0B (~ -38B EUR). Include only as a related/SNA cross-check, not as a direct substitute."
  - "  - BOP CAB is available at both Annual (A) and Quarterly (Q) frequency for France and in 3 units (EUR, XDC, USD)."
