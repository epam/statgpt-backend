query: "What is the population of Germany?"
candidate_datasets:
  - dataset_id: "IMF.RES:WEO(9.0.0)"
    indicator_rank_in_search: 1
    indicator_name: "Population, Persons for countries / Index for country groups"
    dimensions:
      - dimension_name: COUNTRY
        values:
          - { id: "DEU", name: "Germany" }
      - dimension_name: INDICATOR
        values:
          - { id: "LP", name: "Population, Persons for countries / Index for country groups" }
      - dimension_name: FREQUENCY
        values:
          - { id: "A", name: "Annual" }
    sample_data:
      - period: "2022"
        value: 82529000.0
        unit: "Persons (scale 10^6 -> raw value in persons)"
      - period: "2023"
        value: 83286500.0
        unit: "Persons (scale 10^6 -> raw value in persons)"
      - period: "2024"
        value: 83516500.0
        unit: "Persons (scale 10^6 -> raw value in persons)"
notes:
  - "Only one dataset in the channel exposes a true 'population' indicator: WEO with code LP. Cross-dataset search_indicators across 5 phrasings (population, total population, inhabitants, demographic total, resident population, number of people country, headcount country size) consistently ranked WEO.LP as the unique top hit (score 1.0)."
  - "Datasets considered and rejected:"
  - "  - IMF.STA:NSDP(7.0.0) - top hits are LS.LLF_PE.NUM (Labor force), LS.LE_PE.NUM (Employed persons), LS.LU_PE.NUM (Unemployed persons). NSDP_CAT codelist has 8 entries (LS, BOP00, CPI00, ILV00, IND00, MET00, NAG00, PPI00); no Population category exists. Person-count series are labor-only, not population."
  - "  - IMF.RES:WEO(9.0.0) also returns LE (Employed persons) and NGDPPC/NGDPRPC (GDP per capita) which use population in the denominator but do not themselves report population - rejected as candidate indicators (LP is the only true population series)."
  - "  - IMF.STA:FAS(5.0.0) - person counts are depositors/borrowers/policy holders, not population."
  - "  - IMF.STA:ANEA(6.0.1) - dataset-scoped search returned only GDP and consumption aggregates; no population series."
  - "  - All other datasets (BOP, CPI, DIP, EER, ER, FSIC, FM, GFS_SOO, IIP, IMTS, LBS, MFS_CBS, QNEA, PIP, DSS, BIS:WS_EER) showed no population indicator in any probe."
  - "Caveats:"
  - "  - WEO LP reports the value scaled (raw value = persons; SCALE field = 6 indicating millions in the source schema but the 'value' returned is already in absolute persons, e.g. 82,529,000 for DEU 2022). Downstream formatting should respect the SCALE field if reporting in millions."
  - "  - WEO is annual only (FREQUENCY codelist size = 1, code 'A'). UNIT field comes back empty in the row payload; the dataset metadata implies 'Persons' for country-level series and an index for country groups; DEU is a country so unit is Persons."
  - "  - WEO contains forecasts; values for years beyond the latest IMF data round will be IMF projections, not observed values."
search_queries_used:
  - "population"
  - "total population"
  - "inhabitants"
  - "demographic total"
  - "resident population"
  - "number of people country"
  - "headcount country size"
  - "population (dataset-scoped IMF.STA:NSDP)"
  - "population (dataset-scoped IMF.STA:ANEA)"
tool_call_count: 16
