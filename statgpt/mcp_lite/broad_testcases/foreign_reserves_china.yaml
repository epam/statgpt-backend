    indicator_rank_in_search: 3
    indicator_name: "Reserve assets, Assets (transactions / flows breakdown)"
    dimensions:
      - dimension_name: COUNTRY
        values:
          - { id: "CHN", name: "China, People's Republic of" }
      - dimension_name: INDICATOR
        values:
