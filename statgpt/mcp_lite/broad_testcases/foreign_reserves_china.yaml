          - { id: "R_FK_MV", name: "Reserve assets, Reserve position in the IMF" }
          - { id: "R_F11_MV", name: "Reserve assets, Monetary gold" }
          - { id: "R_F12_MV", name: "Reserve assets, Special Drawing Rights (SDRs)" }
