notes:
  - "Two datasets in the channel carry reserve data for China (CHN):"
  - "  - IMF.STA:IIP(13.0.0) is the primary answer to 'what are the foreign reserves of China': IIP reports STOCK positions (BOP_ACCOUNTING_ENTRY=A_P) of reserve assets. Top-level indicator code is 'R' (Reserve assets); sub-components R_F11_MV (Monetary gold), R_F12_MV (SDRs), R_FK_MV (IMF reserve position), R_FR2 (other - currency, deposits, securities, derivatives, claims) are also present. 2024 total ~$3.46T, in line with public figures for China's reserves."
  - "  - IMF.STA:BOP(21.0.0) carries the same reserve breakdown but as transaction FLOWS (BOP_ACCOUNTING_ENTRY=A_T). No bare 'R' code for China here; the closest aggregate is R_AFR. Values are change-in-reserves over the period (can be negative). Useful for follow-ups like 'how did China's reserves change in 2024' but not for the headline 'what are the reserves' question."
  - "Datasets considered and rejected:"
  - "  - IMF.STA:NSDP(7.0.0) - exposes the top-scoring reserves indicator ILV00.RAF (International reserves and foreign currency liquidity, Official Reserve Assets) in both XDC and USD, BUT the COUNTRY codelist contains only 106 reporters and the availability check for {NSDP_CAT:ILV00, INDICATOR:RAF} returned 11 reporters; China (CHN) is not among them. Mainland China does not publish to this SDDS NSDP series. Rejected for the 'China' query."
  - "  - IMF.STA:MFS_CBS(24.0.0) - has the highly relevant indicator S121_A_OFAIL_ACO_NRES_FC_CBS (Assets, Other Foreign Assets, International Liquidity, Claims on Nonresidents, Foreign Currency, Central Bank). Availability check (filter on this indicator + USD) returned 177 reporters; China (CHN) is not present (only HKG and MAC of the China group). Rejected."
  - "  - IMF.RES:WEO(9.0.0) - top reserves hit is BFRA (Change in reserve assets, Net) - a flow, not a stock. Availability for {COUNTRY:CHN, INDICATOR:BFRA} returns no observations. WEO does not publish reserves data for China. Rejected."
  - "  - IMF.STA:FSIC(13.0.1) - 'reserves' top hits are insurance 'Capital and reserves' (shareholder equity context). Not foreign reserves. Rejected."
  - "  - IMF.FAD:FM(5.0.0) - no reserves indicator surfaced; closest results are fiscal balance / debt indicators (cyclically adjusted balance, gross debt). Rejected."
  - "  - IMF.STA:ANEA(6.0.1) - 'reserves' top hits are 'Acquisitions less disposals of valuables' / 'Changes in inventories', i.e. national-accounts inventory concepts, not foreign reserves. Rejected."
  - "  - BIS:WS_NA_SEC_DSS(1.0) - 'reserves' top hits are central-bank debt-securities holdings by maturity. Methodological match, not the foreign-reserves concept. Rejected."
  - "  - BIS:WS_LBS_D_PUB(1.0) - 'FX reserves' probe spuriously returned indicators with 'FX and break adjusted change' in their names; this is a BIS statistical-adjustment methodology applied to locational banking statistics, NOT foreign-currency reserves. Rejected."
  - "  - All other datasets (CPI, DIP, EER, BIS:WS_EER, ER, FAS, IMTS, QNEA, PIP) showed no reserves indicator in cross-dataset probes."
  - "Caveats:"
  - "  - IIP returns SCALE=6 in the row payload; the 'value' field is already in absolute USD (e.g. 3,306,529,000,000 = $3.3T). Downstream formatting that respects SCALE should report in millions ($3,306,529 million)."
  - "  - IIP for China is available at both annual (A) and quarterly (Q) frequency. For a snapshot-style 'what are the reserves' answer, annual or latest-quarter both work; quarterly is preferable for the most recent value."
  - "  - BOP R_AFR is a TRANSACTIONS series and can be negative (2024 = -$60.5B for China). Do not present it as 'China's foreign reserves' - it is the change in reserves over the period."
  - "  - The IIP COUNTRY dim search_codes ranks CHL (Chile) above CHN (China, People's Republic of) on the literal substring 'China' due to the lexical scorer favoring the country-name prefix 'Chi'; the correct code for China is CHN (top semantic hit in BOP/IIP, confirmed by availability check)."
