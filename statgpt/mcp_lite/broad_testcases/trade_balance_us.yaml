notes:
  - "Five distinct US-publishing series cover 'trade balance' across four datasets: IMTS (goods only, by partner), BOP (Goods Net AND Goods+Services Net, on BOP basis), ANEA (External balance of goods and services, annual NA), QNEA (External balance of goods and services, quarterly NA). Cross-dataset search_indicators across 5 phrasings (trade balance, exports minus imports, net exports goods services, merchandise trade balance, goods balance) consistently surfaced these — IMTS.TBG_USD scored 1.0 on 'trade balance' and 'goods balance', NSDP.MET00.TGB.XDC scored 1.0 on 'merchandise trade balance'."
  - "Goods-only vs. goods-and-services distinction:"
  - "  - Goods-only series: IMTS.TBG_USD (annual world counterpart -1.20T USD in 2024), BOP.G.NETCD_T (BOP-basis goods, -1.22T USD in 2024). These two agree to ~1% — IMTS uses customs IMTS methodology, BOP uses balance-of-payments adjustments."
  - "  - Goods-and-services series: BOP.GS.NETCD_T (-903.5B USD in 2024), ANEA.B11.V.XDC (-898.5B USD in 2024), QNEA.B11.V.SA.XDC (quarterly). BOP.GS and ANEA.B11 agree closely (services included; deficit smaller than goods-only because US runs a services surplus)."
  - "Datasets considered and rejected:"
  - "  - IMF.STA:NSDP(7.0.0) - has indicator MET00.TGB.XDC 'Merchandise trade, Goods trade balance' (top hit on 'merchandise trade balance', score 1.0), but availability_query for COUNTRY=USA confirmed the USA does not publish via NSDP MET00; only NAG00 and IND00 are populated for USA. The MET00.TGB series exists for many other countries but not for the US. REJECTED for this query."
  - "  - IMF.RES:WEO(9.0.0) - dataset-scoped probes for 'trade balance', 'net exports', 'balance of trade goods services' returned no direct level-series. WEO exposes BX (exports) and BM (imports) of goods and services separately (could be subtracted to derive net exports), TRADEPCH/TTTPCH/TTPCH (percent-change measures), and BCA (current account balance, broader than trade balance). WEO has no direct 'trade balance' indicator. REJECTED as candidate."
  - "  - IMF.STA:IIP(13.0.0), DIP, PIP - position datasets, not trade flow."
  - "  - IMF.STA:GFS_SOO(12.0.0) - 'Taxes on international trade' surfaced but is fiscal revenue, not trade balance."
  - "  - IMF.STA:FSIC, FAS, MFS_CBS, CPI, ER, EER, BIS:WS_EER, BIS:WS_NA_SEC_DSS, BIS:WS_LBS_D_PUB, FM - no trade balance indicator surfaced in probes."
  - "Caveats:"
  - "  - IMTS reports goods-only and is bilateral by partner; for the headline figure use COUNTERPART_COUNTRY=G001 (World). Other counterpart aggregates (G110 Advanced Economies, G200 EMDEs) are also available."
  - "  - BOP.G.NETCD_T and IMTS.TBG_USD both measure goods-only trade balance but differ slightly in methodology (BOP basis vs. customs/IMTS basis). Use BOP for BoP-consistent analysis."
  - "  - ANEA/QNEA use TYPE_OF_TRANSFORMATION='XDC' (domestic currency, which for the USA equals USD) — the 'USD' code is listed in availability but returns no data for the US series. PRICE_TYPE='V' (current prices) returns data; PRICE_TYPE='Q' (constant prices) is listed but also returns empty for USA. SCALE=0 means values are already in absolute USD."
  - "  - QNEA quarterly is available SA and NSA; SA + XDC + V is the most analyst-friendly slice."
  - "  - IMTS values returned with SCALE=6 in the row but the raw 'value' is already in absolute USD (matches BOP.G.NETCD_T within ~1%), so downstream formatting should treat IMTS values as absolute USD, not multiply by 10^6."
