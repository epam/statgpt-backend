caveats:
  - "ANEA pinned to PRICE_TYPE=V (current prices) + TYPE_OF_TRANSFORMATION=XDC (domestic currency, INR). India has B1GQ available in XDC, USD, and IX (index) per availability_query, but the {V,USD} combination returned 0 observations — IMF appears to publish India's annual GDP only in XDC at current prices, not at USD current prices. WEO is the canonical source for the USD-denominated GDP of India."
  - "ANEA also exposes B1GQPA (production approach) for many countries; for India, B1GQ (expenditure approach) is the primary series."
  - "QNEA values (INR ~62-71 trillion per quarter) and ANEA annual values (INR ~219-281 trillion) are mutually consistent (4-quarter sum ≈ annual)."
  - "WEO reports GDP at scale=9 (billions of USD) so the displayed value 3,249,938,889,000 means USD 3,249.94 billion ≈ USD 3.25 trillion for 2022 — matches widely-known India GDP figures."
  - "FSIC values are in INR millions (scale=6) so 268,904,700,000,000 = INR 268.9 trillion for 2022 — matches ANEA. FSIC re-publishes the GDP series as a denominator for financial-soundness ratios (e.g. household debt / GDP); valid GDP source but ratio-construction is its primary use."
  - "Constant-price (PRICE_TYPE=Q / NGDP_R) and per-capita (NGDPPC / NGDPDPC) variants exist in ANEA / QNEA / WEO but are not pinned here — they answer 'real GDP' or 'GDP per capita' rather than the bare 'GDP'. Downstream agents should disambiguate user intent."
  - "GDP deflators (B1GQ.PD.IX / NGDP_D) and growth rates (NGDP_RPCHMK) also surface under GDP queries but are not GDP levels."
