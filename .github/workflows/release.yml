name: Release Workflow

on:
  push:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write
      checks: write
      security-events: write
    with:
      bypass-checks: false
      style-checks-enabled: true
      style-checks-bypassed: false
      code-checks-enabled: true
      code-checks-bypassed: false
      ort-enabled: true
      ort-bypassed: false
      ort-version: "85.0.0" # HACK: pin ORT version due to java.util.NoSuchElementException in 85.1.0
      ort-config-repository: "https://github.com/oss-review-toolkit/ort-config.git"
      ort-config-revision: "5650fed55a20397b9abb9017a0c6bb674dc8481d"
      python-version: "3.11"
      poetry-version: "2.1.1"
      runs-on: '["ubuntu-24.04"]'
      maximize-build-space: false

  calculate_version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      next-version: ${{ steps.semantic_versioning.outputs.next-version }}
      next-version-without-hyphens: ${{ steps.semantic_versioning.outputs.next-version-without-hyphens }}
      is-latest: ${{ steps.semantic_versioning.outputs.is-latest }}
      latest-stable-tag: ${{ steps.semantic_versioning.outputs.latest-stable-tag }}
      changelog-mode: ${{ steps.semantic_versioning.outputs.changelog-mode }}
    steps:
      - uses: epam/ai-dial-ci/actions/semantic_versioning@4.4.0
        id: semantic_versioning
        with:
          promote: true

  release:
    runs-on: ubuntu-24.04
    needs: [test, calculate_version]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        include:
          - image-name: "epam/statgpt-chat-backend"
            dockerfile: "docker/chat.Dockerfile"
          - image-name: "epam/statgpt-admin-backend"
            dockerfile: "docker/admin.Dockerfile"

    steps:
      - name: Maximize build space
        uses: nepalevov/maximize-build-space@046c48361370e2f3fa758bd2f10c6ce29109ef62 # v1.1.0
        if: false # Maximize build space by removing unwanted software if set to true
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          remove-java: "true"
          remove-swift: "true"
          remove-julia: "true"
          remove-browsers: "true"
          remove-cloud-tools: "true"
          remove-kubernetes-tools: "true"
          remove-powershell: "true"
          remove-container-tools: "true"
          remove-rust: "true"
          remove-python: "true"
          remove-node: "true"
          remove-go: "true"
          remove-ruby: "true"
          docker-cleanup: "true"
          set-tmpdir: "true"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}

      - name: Set version in pyproject.toml for Docker build
        shell: bash
        run: |
          sed -i "s/^version = .*/version = \"${{ needs.calculate_version.outputs.next-version-without-hyphens }}\"/g" pyproject.toml

      - uses: ./.github/actions/build_docker
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.ACTIONS_BOT_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_LOGIN }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-name: ghcr.io/${{ matrix.image-name }}
          dockerfile-path: ${{ matrix.dockerfile }}
          image-tag: ${{ startsWith(github.ref, 'refs/heads/release-') && needs.calculate_version.outputs.next-version || 'development' }}
          push-enabled: true
          trivy-enabled: true
          bypass-checks: false
          trivy-severity: "CRITICAL,HIGH"
          trivy-severity-for-sarif: "CRITICAL,HIGH"
          trivy-limit-severities-for-sarif: true
          platforms: "linux/amd64"
          image-extra-aliases: |
            ${{ matrix.image-name }}:${{ startsWith(github.ref, 'refs/heads/release-') && needs.calculate_version.outputs.next-version || 'development' }}
            ${{ startsWith(github.ref, 'refs/heads/release-') && needs.calculate_version.outputs.is-latest == 'true' && format('{0}:latest', matrix.image-name) || '' }}
            ${{ startsWith(github.ref, 'refs/heads/release-') && needs.calculate_version.outputs.is-latest == 'true' && format('{0}/{1}:{2}', 'ghcr.io', matrix.image-name, 'latest') || '' }}

  create_release:
    runs-on: ubuntu-24.04
    needs: [calculate_version, release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}

      - name: Set version in pyproject.toml for release
        shell: bash
        run: |
          sed -i "s/^version = .*/version = \"${{ needs.calculate_version.outputs.next-version-without-hyphens }}\"/g" pyproject.toml

      - uses: epam/ai-dial-ci/actions/generate_release_notes@4.4.0
        with:
          latest-tag: ${{ needs.calculate_version.outputs.latest-stable-tag }}
          use-merge-base: ${{ needs.calculate_version.outputs.changelog-mode == 'merge-base' }}

      - uses: epam/ai-dial-ci/actions/publish_tag_release@4.4.0
        if: ${{ startsWith(github.ref, 'refs/heads/release-') }}
        with:
          git-user-name: ${{ vars.ACTIONS_BOT_NAME || 'statgpt-actions' }}
          git-user-email: ${{ vars.ACTIONS_BOT_EMAIL || '231008922+statgpt-actions@users.noreply.github.com' }}
          tag-version: ${{ needs.calculate_version.outputs.next-version }}
          changelog-file: "/tmp/my_changelog" # Comes from generate_release_notes step
          draft-stable-releases: true
          extra-commit-command: |
            git add pyproject.toml
            git commit -m '[skip ci] Update version' || true # Upstream branch may already be updated
