name: Tests

on:
  workflow_call:
    inputs:
      bypass-checks:
        type: boolean
        description: Do not fail pipeline if checks failed
        default: false
      style-checks-enabled:
        type: boolean
        description: Enable style_checks
        default: true
      style-checks-bypassed:
        type: boolean
        description: Do not fail pipeline if style_checks failed
        default: false
      code-checks-enabled:
        type: boolean
        description: Enable code_checks
        default: true
      code-checks-bypassed:
        type: boolean
        description: Do not fail pipeline if code_checks failed
        default: false
      ort-enabled:
        type: boolean
        description: Enable ORT scanning
        default: true
      ort-bypassed:
        type: boolean
        description: Do not fail pipeline if ORT scan failed
        default: false
      ort-version:
        type: string
        description: ORT version to use
        default: "92.5.0"
      ort-config-repository:
        type: string
        description: ORT config repository to use
        default: ${{ vars.ORT_CONFIG_VCS_URL || 'https://github.com/epam/ai-dial-ort-config.git' }}
      ort-config-revision:
        type: string
        description: ORT config revision to use
        default: ${{ vars.ORT_CONFIG_VCS_REVISION || '92.5.0' }}
      python-version:
        type: string
        description: Python version to use
        default: "3.11"
      poetry-version:
        type: string
        description: Poetry version to use
        default: "2.1.1"
      python-package-manager:
        type: string
        description: Python package manager to use
        default: "poetry"
      uv-version:
        type: string
        description: UV version to use
        default: "0.11.30"
      runs-on:
        type: string
        description: Overrides jobs runs-on settings (json-encoded list)
        default: '["ubuntu-24.04"]'
      maximize-build-space:
        type: boolean
        description: Maximize build space by removing unwanted software
        default: false

permissions:
  contents: read

env:
  # Database
  TEST_DATABASE_HOST: localhost
  TEST_DATABASE_PORT: 5432
  TEST_DATABASE: test_db
  PGVECTOR_USER: ${{ secrets.PGVECTOR_TEST_USER }}
  PGVECTOR_PASSWORD: ${{ secrets.PGVECTOR_TEST_PASSWORD }}

  # Elastic
  ELASTIC_CONNECTION_STRING: http://localhost:9200

  # Python
  PIP_CACHE_DIR: "${{ github.workspace }}/.cache/pip"
  VENV_DIR: "${{ github.workspace }}/.venv"

jobs:
  style_checks:
    if: ${{ inputs.style-checks-enabled }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - name: Maximize build space
        uses: nepalevov/maximize-build-space@046c48361370e2f3fa758bd2f10c6ce29109ef62 # v1.1.0
        if: ${{ inputs.maximize-build-space }}
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-large-packages: "false" # keep libgl1-mesa-dev
          remove-cached-tools: "true"
          remove-swapfile: "true"
          remove-java: "true"
          remove-swift: "true"
          remove-julia: "true"
          remove-browsers: "true"
          remove-cloud-tools: "true"
          remove-kubernetes-tools: "true"
          remove-powershell: "true"
          remove-container-tools: "true"
          remove-rust: "true"
          remove-python: "false" # just in case
          remove-node: "true"
          remove-go: "true"
          remove-ruby: "true"
          docker-cleanup: "true"
          set-tmpdir: "true"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: epam/ai-dial-ci/actions/python_prepare@4.13.2
        with:
          python-version: ${{ inputs.python-version }}
          poetry-install: ${{ inputs.python-package-manager == 'poetry' }}
          poetry-version: ${{ inputs.poetry-version }}
          uv-install: ${{ inputs.python-package-manager == 'uv' }}
          uv-version: ${{ inputs.uv-version }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run style checks
        continue-on-error: ${{ inputs.bypass-checks || inputs.style-checks-bypassed }}
        shell: bash
        run: |
          make lint

  code_checks:
    if: ${{ inputs.code-checks-enabled }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      actions: write
      checks: write

    services:
      vectordb:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_DB: ${{ env.TEST_DATABASE }}
          POSTGRES_USER: ${{ env.PGVECTOR_USER }}
          POSTGRES_PASSWORD: ${{ env.PGVECTOR_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
        env:
          xpack.security.enabled: false
          xpack.security.enrollment.enabled: false
          discovery.type: single-node
          node.name: es-node-01
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Maximize build space
        uses: nepalevov/maximize-build-space@046c48361370e2f3fa758bd2f10c6ce29109ef62 # v1.1.0
        if: ${{ inputs.maximize-build-space }}
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-large-packages: "false" # keep libgl1-mesa-dev
          remove-cached-tools: "true"
          remove-swapfile: "true"
          remove-java: "true"
          remove-swift: "true"
          remove-julia: "true"
          remove-browsers: "true"
          remove-cloud-tools: "true"
          remove-kubernetes-tools: "true"
          remove-powershell: "true"
          remove-container-tools: "true"
          remove-rust: "true"
          remove-python: "false" # just in case
          remove-node: "true"
          remove-go: "true"
          remove-ruby: "true"
          docker-cleanup: "true"
          set-tmpdir: "true"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: epam/ai-dial-ci/actions/python_prepare@4.13.2
        with:
          python-version: ${{ inputs.python-version }}
          poetry-install: ${{ inputs.python-package-manager == 'poetry' }}
          poetry-version: ${{ inputs.poetry-version }}
          uv-install: ${{ inputs.python-package-manager == 'uv' }}
          uv-version: ${{ inputs.uv-version }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Wait for services to be ready
        run: |
          # Wait for PostgreSQL
          until pg_isready -h localhost -p 5432 -U ${{ env.PGVECTOR_USER }}; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          # Wait for Elasticsearch
          until curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green"'; do
            echo "Waiting for Elasticsearch..."
            sleep 2
          done

          echo "All services are ready!"

      - name: Run code checks (tests)
        continue-on-error: ${{ inputs.bypass-checks || inputs.code-checks-bypassed }}
        shell: bash
        env:
          TEST_DATABASE_HOST: ${{ env.TEST_DATABASE_HOST }}
          TEST_DATABASE_PORT: ${{ env.TEST_DATABASE_PORT }}
          TEST_DATABASE: ${{ env.TEST_DATABASE }}
          PGVECTOR_USER: ${{ env.PGVECTOR_USER }}
          PGVECTOR_PASSWORD: ${{ env.PGVECTOR_PASSWORD }}
          ELASTIC_CONNECTION_STRING: ${{ env.ELASTIC_CONNECTION_STRING }}
        run: |
          make test

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: reports/tests-*.xml
          retention-days: 30

  ort:
    if: ${{ inputs.ort-enabled }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      security-events: write
    continue-on-error: ${{ inputs.bypass-checks || inputs.ort-bypassed }}
    steps:
      - name: Use HTTPS instead of SSH for Git cloning # recommended by ort-ci-github-action doc but not *actually* required until we'll run downloader/scanner tools
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # ORT analyzer doesn't support UV directly, so for UV projects export uv.lock to a
      # requirements.txt and let ORT analyze it as a PIP project instead.
      - name: Set up Python
        if: ${{ inputs.python-package-manager == 'uv' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up UV
        if: ${{ inputs.python-package-manager == 'uv' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
      - name: Export UV dependencies to requirements.txt
        if: ${{ inputs.python-package-manager == 'uv' }}
        run: uv export --frozen --all-extras --format requirements.txt --output-file requirements.txt
        shell: bash

      - uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1.2.0
        with:
          image: "ghcr.io/oss-review-toolkit/ort-minimal:${{ inputs.ort-version }}"
          allow-dynamic-versions: "true"
          fail-on: "violations"
          run: "cache-dependencies, labels, analyzer, evaluator, reporter, upload-results"
          # Provide more RAM; Only applies to GitHub hosted runners for public repositories
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          ort-jdk-java-options: "-Xmx${{ github.event.repository.private && '5' || '12' }}g"
          ort-cli-args: >-
            -P ort.forceOverwrite=true
            --stacktrace
            -P ort.analyzer.enabledPackageManagers=${{ inputs.python-package-manager == 'uv' && 'PIP' || 'Poetry' }}
            -P ort.analyzer.packageManagers.${{ inputs.python-package-manager == 'uv' && 'PIP' || 'Poetry' }}.options.pythonVersion=${{ inputs.python-version }}
          ort-config-repository: ${{ inputs.ort-config-repository }}
          ort-config-revision: ${{ inputs.ort-config-revision }}

      - name: Fail on ORT Analyzer errors
        run: |
          result="$HOME/.ort/ort-results/analyzer-result.json"
          [ -f "$result" ] || { echo "::error::Analyzer result not found: $result"; exit 1; }
          # Recursively collect every object with a severity+message under `analyzer`,
          # so this works regardless of layout (top-level issues map, dependency nodes, etc.)
          # and across all package managers (NPM, Gradle, ...).
          filter='[.analyzer | .. | objects | select(has("severity") and has("message")) | select(.severity == "ERROR")]'
          count=$(jq "$filter | length" "$result")
          echo "Analyzer ERROR issues: $count"
          if [ "$count" -gt 0 ]; then
            jq -r "$filter[] | \"[\(.severity)] \(.source // \"unknown\"): \(.message)\"" "$result"
            echo "::error::ORT Analyzer reported $count error(s). Check the report to address them."
            exit 1
          fi
