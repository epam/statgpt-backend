  - id_: "9f7b0746-5254-4a76-b11f-9a19ce0ea252"
    <<: *shared_settings
    title: "IMF.STA:ANEA"
    details:
      <<: *shared_details
      urn:
        agency_id: "IMF.STA"
        resource_id: "ANEA"
        version: "6.0.1"
      dimensions:
        INDICATOR:
          dimensionType: "INDICATOR"
          isRequired: true
        PRICE_TYPE:
          dimensionType: "INDICATOR"
          isRequired: true
        TYPE_OF_TRANSFORMATION:
          dimensionType: "INDICATOR"
          isRequired: false
        <<: *common_dimensions
        TIME_PERIOD:
          dimensionType: "TIME_PERIOD"
          defaultQueries:
            - values: [ "-5y", "now" ]
              operator: "between"
      includeAttributes:
        - "SCALE"
        - "UNIT"
        - "PUBLISHER"
        - "SOURCE"
      citation:
        provider: "IMF.STA"
        url: "https://data.imf.org/en/datasets/IMF.STA:ANEA"
        description: &anea-description >
          This dataset presents national, official estimates of annual expenditure-based Gross Domestic Product (GDP),
          by economy. Estimates are presented in nominal terms (current prices) and volume terms (with the effect of
          price changes removed). National accounts statistics are used to measure and analyze the overall economic
          performance of a country, including key indicators such as gross domestic product (GDP), income, savings,
          investment, and employment. These statistics play a vital role in economic policy formulation, macroeconomic
          analysis, forecasting, benchmarking, international comparisons, and assessing the impact of economic policies
          on various sectors and stakeholders. The statistics are sourced from national authorities (central banks,
          national statistical institutes, ministries of finance) and collected using the IMF's National Accounts
          Report Form. Where possible, the IMF has entered into data-sharing agreements with international
          organizations that collect the same or similar statistics from national authorities. In these cases,
          the IMF sources the statistics from the international organization to reduce the reporting burden on
          countries. World and special country aggregations are computed by the IMF and constitute IMF estimates.
          World and special country aggregations are based on data submitted by national authorities, with
          imputations performed by IMF staff when estimates are missing.

          Represents same data as "IMF.STA:QNEA", but for annual frequency.
      pinnedColumns:
        - "FREQUENCY_Name"
        - "COUNTRY_Name"
        - "PRICE_TYPE_Name"
        - "TYPE_OF_TRANSFORMATION_Name"
        - "INDICATOR_Name"
      indexer:
        description: *anea-description
        indicator:
          unpack: true
          useCodeListDescription: true

  - id_: "08483b2b-60d7-429b-941f-1cc3eddd1eaf"
