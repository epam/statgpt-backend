        agency_id: "IMF.STA"
        resource_id: "QNEA"
        version: "7.0.0"
      dimensions:
        INDICATOR:
          dimensionType: "INDICATOR"
          isRequired: true
        PRICE_TYPE:
          dimensionType: "INDICATOR"
          isRequired: true
        S_ADJUSTMENT:
          dimensionType: "INDICATOR"
          isRequired: true
        TYPE_OF_TRANSFORMATION:
          dimensionType: "INDICATOR"
          isRequired: false
        <<: *common_dimensions
        TIME_PERIOD:
          dimensionType: "TIME_PERIOD"
          defaultQueries:
            - values: [ "-5y", "now" ]
              operator: "between"
      includeAttributes:
        - "SCALE"
        - "UNIT"
        - "PUBLISHER"
        - "SOURCE"
      citation:
        provider: "IMF.STA"
        url: "https://data.imf.org/en/datasets/IMF.STA:QNEA"
        description: &qnea-description >
          This dataset provides a snapshot of the economic activity of various countries on a quarterly basis. It
          offers quarterly measurements of key indicators like Gross Domestic Product (GDP), consumption, investment,
          government spending, and foreign trade. Quarterly estimates are disseminated on non-seasonally adjusted and
          seasonally adjusted bases. National accounts statistics are used to measure and analyze the overall economic
          performance of a country, including key indicators such as gross domestic product (GDP), income, savings,
          investment, and employment. These statistics play a vital role in economic policy formulation, macroeconomic
          analysis, forecasting, benchmarking, international comparisons, and assessing the impact of economic policies
          on various sectors and stakeholders. The statistics are sourced from national authorities (central banks,
          national statistical institutes, ministries of finance) and collected using the IMF's National Accounts
          Report Form. Where possible, the IMF has entered into data-sharing agreements with international
          organizations that collect the same or similar statistics from national authorities. In these cases, the IMF
          sources the statistics from the international organization to reduce the reporting burden on countries.
          World and special country aggregations are computed by the IMF and constitute IMF estimates. World and
          special country aggregations are based on data submitted by national authorities, with imputations
          performed by IMF staff when estimates are missing.

          Represents same data as "IMF.STA:ANEA", but for quarterly frequency.
      pinnedColumns:
        - "FREQUENCY_Name"
        - "COUNTRY_Name"
        - "S_ADJUSTMENT_Name"
        - "PRICE_TYPE_Name"
        - "TYPE_OF_TRANSFORMATION_Name"
        - "INDICATOR_Name"
      indexer:
        description: *qnea-description
        indicator:
          unpack: true
          useCodeListDescription: true

  - id_: "fd14377b-7dd8-4971-ab3b-6a9bca191a08"
    <<: *shared_settings
