        <<: *common_dimensions
        TIME_PERIOD:
          dimensionType: "TIME_PERIOD"
          defaultQueries:
            - values: [ "-5y", "now" ]
              operator: "between"
      includeAttributes:
        - "SCALE"
        - "UNIT"
        - "PUBLISHER"
        - "SOURCE"
      citation:
        provider: "IMF.STA"
        url: "https://data.imf.org/en/datasets/IMF.STA:CPI"
        description: &cpi-description >
          The Consumer Price Index (CPI) dataset includes the national consumer price indexes by economy. In addition to
          the all items, headline index, detailed indexes by Division (e.g. Food and Non-alcoholic beverages, Clothing,
          etc.), their associated weights, and contributions to national annual inflation are published where available.
          In addition to the national CPIs, the CPI dataset includes the Harmonised Indices of Consumer Prices (HICPs)
          compiled by Eurostat for Europe. Consumer price indexes measure the relative changes over time in the prices
          of goods and services purchased by households, which households use directly, or indirectly, to satisfy their
          own needs and wants.
      pinnedColumns:
        - "FREQUENCY_Name"
        - "COUNTRY_Name"
