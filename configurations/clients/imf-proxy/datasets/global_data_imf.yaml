  - id_: "2264072f-f90d-4fda-aff0-4a652bff89f1"
    <<: *shared_settings
    title: "IMF.RES:WEO"
    details:
      <<: *shared_details
      urn:
        agency_id: "IMF.RES"
        resource_id: "WEO"
        version: "9.0.0"
      dimensions:
        INDICATOR:
          dimensionType: "INDICATOR"
          isRequired: true
        <<: *common_dimensions
        TIME_PERIOD:
          dimensionType: "TIME_PERIOD"
          defaultQueries:
            - values: [ "-5y", "+2y" ]
              operator: "between"
      includeAttributes:
        - "SCALE"
        - "UNIT"
        - "PUBLISHER"
        - "SOURCE"
      citation:
        provider: "IMF.RES"
        url: "https://data.imf.org/en/datasets/IMF.RES:WEO"
        description: &weo-description >
          The World Economic Outlook (WEO) database contains selected macroeconomic data series from the statistical
          appendix of the World Economic Outlook report, which presents the IMF staff's analysis and projections of
          economic developments at the global level, in major country groups and in many individual countries. The WEO
          is released in April and September/October each year. Use this database to find data on national accounts,
          gross domestic product (GDP), inflation, unemployment rates, balance of payments, fiscal indicators, trade
          for countries and country groups (aggregates), and commodity prices whose data are reported by the IMF. Data
          are available from 1980 to the present, and projections are given for the next two years. Additionally,
          medium-term projections are available for selected indicators. For some countries, data are incomplete or
          unavailable for certain years.
      pinnedColumns:
        - "FREQUENCY_Name"
        - "COUNTRY_Name"
        - "INDICATOR_Name"
      indexer:
        description: *weo-description
        indicator:
          unpack: true
          useCodeListDescription: true

  - id_: "d4857995-322c-4edd-a24e-37605dcdacfe"
    <<: *shared_settings
    title: "IMF.STA:FAS"
    details:
      <<: *shared_details
      urn:
        agency_id: "IMF.STA"
        resource_id: "FAS"
        version: "4.0.0"
      dimensions:
        INDICATOR:
          dimensionType: "INDICATOR"
          isRequired: true
        TYPE_OF_TRANSFORMATION:
          dimensionType: "INDICATOR"
          isRequired: true
        <<: *common_dimensions
        TIME_PERIOD:
          dimensionType: "TIME_PERIOD"
          defaultQueries:
            - values: [ "-5y", "now" ]
              operator: "between"
      includeAttributes:
        - "SCALE"
        - "UNIT"
        - "PUBLISHER"
        - "SOURCE"
      citation:
        provider: "IMF.STA"
        url: "https://data.imf.org/en/datasets/IMF.STA:FAS"
        description: &fas-description >
          The Financial Access Survey (FAS) dataset includes annual statistics on access to and usage of financial
          services. It showcases traditional (e.g., deposits, loans, and insurance) and non-traditional (mobile money
          and mobile and internet banking) financial service data. Selected data series are disaggregated by gender
          (male and female), the type of financial service provider (e.g., commercial banks, credit unions, and
          microfinance institutions) and the type of customer (e.g., households and SMEs). These cross-country
          comparable statistics help policymakers and financial institutions identify gaps in financial inclusion,
          design targeted interventions, and monitor progress towards enhancing access to financial services. The
          statistics are sourced from country authorities (mainly central banks and other regulators).
      pinnedColumns:
        - "FREQUENCY_Name"
        - "COUNTRY_Name"
        - "INDICATOR_Name"
      indexer:
        description: *fas-description
        indicator:
          unpack: true
          useCodeListDescription: true

  - id_: "ffda753f-3e15-4b9e-ae4d-73096ac59002"
    <<: *shared_settings
    title: "IMF.FAD:FM"
    details:
      <<: *shared_details
      urn:
        agency_id: "IMF.FAD"
        resource_id: "FM"
        version: "5.0.0"
      dimensions:
        INDICATOR:
          dimensionType: "INDICATOR"
          isRequired: true
        <<: *common_dimensions
        TIME_PERIOD:
          dimensionType: "TIME_PERIOD"
          defaultQueries:
            - values: [ "-5y", "now" ]
              operator: "between"
      includeAttributes:
        - "SCALE"
        - "UNIT"
        - "PUBLISHER"
        - "SOURCE"
      citation:
        provider: "IMF.FAD"
        url: "https://data.imf.org/en/datasets/IMF.FAD:FM"
        description: &fad-description >
          The Fiscal Monitor surveys and analyzes the latest public finance developments. It updates fiscal
          implications of the crisis and medium-term fiscal projections, and assesses policies to put public finances
          on a sustainable footing.

          Country-specific data and projections for key fiscal variables are based on the April 2025 World Economic
          Outlook database, unless indicated otherwise, and compiled by the IMF staff. Historical data and projections
          are based on the information gathered by IMF country desk officers in the context of their missions and
          through their ongoing analysis of the evolving situation in each country. They are updated on a continual
          basis as more information becomes available. Structural breaks in data may be adjusted to produce smooth
          series through splicing and other techniques. IMF staff estimates serve as proxies when complete information
          is unavailable. As a result, Fiscal Monitor data can differ from official data in other sources, including
          the IMF’s International Financial Statistics.

          All fiscal data refer to the general government where available and to calendar years, except for Bahamas,
          Bangladesh, Barbados, Bhutan, Botswana, Dominica, Egypt, Eswatini, Ethiopia, Fiji, Haiti, Hong Kong Special
          Administrative Region, India, the Islamic Republic of Iran, Jamaica, Lesotho, Malawi, the Marshall Islands,
          Mauritius, Micronesia, Myanmar, Namibia, Nauru, Nepal, Pakistan, Palau, Puerto Rico, Rwanda, St. Lucia,
          Samoa, Singapore, Thailand, Tonga, and Trinidad and Tobago, for which they refer to the fiscal year.

          Composite data for country groups are weighted averages of individual-country data, unless otherwise
          specified. Data are weighted by annual nominal GDP converted to U.S. dollars at average market exchange
          rates as a share of the group GDP.

          For most countries, fiscal data follow the IMF’s Government Finance Statistics Manual 2014. The overall
          fiscal balance refers to net lending (+)/borrowing (–) of the general government. In some cases, however,
          the overall balance refers to total revenue and grants minus total expenditure and net lending.
      pinnedColumns:
        - "FREQUENCY_Name"
        - "COUNTRY_Name"
        - "INDICATOR_Name"
      indexer:
        description: *fad-description
        indicator:
          unpack: true
          useCodeListDescription: true
