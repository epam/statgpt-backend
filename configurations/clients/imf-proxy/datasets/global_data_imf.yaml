_anchors:
  _shared_settings: &shared_settings
    dataSource: IMF_SDMX30_PROXY
    channels:
      - "world-economy-v2-hybrid-proxy"
  _shared_details: &shared_details
    useTitleFromSrc: true
  _common_dimensions: &common_dimensions
    COUNTRY:
      dimensionType: "NON_INDICATOR"
      subtype: "REGION"
      alias: "Country/Reference area"
      allValues:
        id: "ALL_COUNTRIES"
        name: "All countries - must be selected when query explicitly asks for all countries"
        description: "Special value to query all countries"
    FREQUENCY:
      dimensionType: "NON_INDICATOR"
      subtype: "FREQUENCY"

dataSets:

  - id_: "932a354d-edb4-487e-b2f5-bc44b16eb27a"
    <<: *shared_settings
    title: "IMF.STA:FSIC"
    details:
      <<: *shared_details
      urn:
        agency_id: "IMF.STA"
        resource_id: "FSIC"
        version: "13.0.1"
      dimensions:
        INDICATOR:
          dimensionType: "INDICATOR"
          isRequired: true
        SECTOR:
          dimensionType: "INDICATOR"
          isRequired: true
        <<: *common_dimensions
        TIME_PERIOD:
          dimensionType: "TIME_PERIOD"
          defaultQueries:
            - values: [ "-5y", "now" ]
              operator: "between"
      includeAttributes:
        - "SCALE"
        - "UNIT"
        - "PUBLISHER"
        - "SOURCE"
      citation:
        provider: "IMF.STA"
        url: "https://data.imf.org/en/datasets/IMF.STA:FSIC"
        description: &fsic-description >
          The Financial Soundness Indicators (FSIs), developed by the IMF together with the international community, are
          aimed at supporting macroprudential analysis—the surveillance and assessment of the strengths and
          vulnerabilities of financial systems. FSIs are macroprudential statistics aimed at filling the gap between
          macroeconomic statistics and micro-prudential data. FSIs are categorized into "core" and "additional"
          indicators. Core indicators are essential for all countries, while additional indicators provide more detailed
          insights into financial stability.
      pinnedColumns:
        - "FREQUENCY_Name"
        - "COUNTRY_Name"
        - "SECTOR_Name"
        - "INDICATOR_Name"
      indexer:
        description: *fsic-description
        indicator:
          unpack: true
          useCodeListDescription: true

