  - id_: "1b318dd9-674b-4420-9a44-c0395e89030b"
    <<: *shared_settings
    title: "IMF.STA:EER"
    details:
      <<: *shared_details
      urn:
        agency_id: "IMF.STA"
        resource_id: "EER"
        version: "6.0.0"
      dimensions:
        INDICATOR:
          dimensionType: "INDICATOR"
          isRequired: true
        <<: *common_dimensions
        TIME_PERIOD:
          dimensionType: "TIME_PERIOD"
          defaultQueries:
            - values: [ "-5y", "now" ]
              operator: "between"
      includeAttributes:
        - "SCALE"
        - "UNIT"
        - "PUBLISHER"
        - "SOURCE"
      citation:
        provider: "IMF.STA"
        url: "https://data.imf.org/en/datasets/IMF.STA:EER"
        description: &eer-description >
          The Effective Exchange Rate (EER) dataset includes annual, quarterly and monthly nominal and real effective
          exchange rates by economy. Nominal effective exchange rates (NEERs) measure the value of a country's currency
          in relation to a weighted average of the currency values of their major trading partners. Real effective
          exchange rates (REERs) adjust the NEER to account for a country's inflation rate in relation to the weighted
          inflation rate of their major trading partners. The IMF publishes NEERs and REERs for approximately 90 IMF
          member countries that account for the vast share of global international trade. These statistics help
          policymakers and analysts assess the competitiveness of a country's exports, monitor currency trends, evaluate
          the impact of exchange rate changes on trade flows, and inform decisions regarding monetary policy, exchange
          rate management, and international trade. The EERs are calculated by IMF staff using exchange rate
          information, consumer price indexes received from national authorities and international trade weights. These
          weights are calculated as three-year averages of annual data available from official sources on trade, tourism
          and manufacturing collected from the United Nations (UN), Organization for Economic Co-operation and
          Development (OECD), World Bank, World Tourism Organization (UNWTO), United Nations Industrial Development
          Organization (UNIDO).
      pinnedColumns:
        - "FREQUENCY_Name"
        - "COUNTRY_Name"
        - "INDICATOR_Name"
      indexer:
        description: *eer-description
        indicator:
          unpack: true
          useCodeListDescription: true

